[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ttenet"
version = "0.1.0"
description = "Calendar-aware time-to-event and retail return forecasting"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "numpy>=2.0",
  "pandas>=2.2",
  "jax>=0.10.0,<0.11.3",
  "numpyro>=0.22.0",
  "numpyro-forecast>=0.4.0,<0.5",
]

[project.optional-dependencies]
examples = [
  "matplotlib>=3.8",
  "marimo>=0.23.15",
  "altair>=5.5",
  "coeftable>=0.12.1",
]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.12", "complexipy==8.0.1"]

[tool.hatch.build.targets.wheel]
packages = ["src/ttenet"]

[tool.hatch.build.targets.sdist]
include = [
  "src/ttenet",
  "tests",
  "examples",
  "README.md",
  "LICENSE",
  "pyproject.toml",
  "uv.lock",
  "noxfile.py",
  "complexipy-snapshot.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
